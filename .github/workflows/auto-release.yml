name: auto-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: read version
        id: version
        run: |
          version="$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\(v[0-9][^"]*\)".*/\1/p' internal/version/version.go)"
          if [ -z "$version" ]; then
            echo "could not read Version from internal/version/version.go" >&2
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?$'; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: check existing tag
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.version }} already exists; skipping auto release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: gofmt
        if: steps.release.outputs.exists == 'false'
        run: test -z "$(gofmt -l .)"

      - name: test
        if: steps.release.outputs.exists == 'false'
        run: go test ./...

      - name: build release binaries
        if: steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in \
            darwin/amd64/jailbreakit-darwin-amd64 \
            darwin/arm64/jailbreakit-darwin-arm64 \
            linux/amd64/jailbreakit-linux-amd64 \
            linux/arm64/jailbreakit-linux-arm64
          do
            goos="$(printf '%s' "$target" | cut -d/ -f1)"
            goarch="$(printf '%s' "$target" | cut -d/ -f2)"
            name="$(printf '%s' "$target" | cut -d/ -f3)"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X github.com/Waariss/jailbreakit/internal/version.Version=${VERSION} -X github.com/Waariss/jailbreakit/internal/version.Author=Waariss -X github.com/Waariss/jailbreakit/internal/version.Commit=${GITHUB_SHA} -X github.com/Waariss/jailbreakit/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/${name}" ./cmd/jailbreakit
          done
          cd dist
          sha256sum jailbreakit-* > SHA256SUMS

      - name: choose release notes
        if: steps.release.outputs.exists == 'false'
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="docs/RELEASE-${version}.md"
          if [ ! -f "$notes" ]; then
            notes="/tmp/jailbreakit-release-notes.md"
            {
              echo "# Release ${version}"
              echo
              echo "Automated release for ${version}."
            } > "$notes"
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: create tag and GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "${{ steps.notes.outputs.path }}"
