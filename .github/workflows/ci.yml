name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./cmd/jailbreakit
      - name: installation smoke test
        run: |
          tmp_dir="$(mktemp -d)"
          GOBIN="$tmp_dir" go install ./cmd/jailbreakit
          outside="$(mktemp -d)"
          cd "$outside"
          "$tmp_dir/jailbreakit" version
          "$tmp_dir/jailbreakit" --help
          "$tmp_dir/jailbreakit" doctor
