name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: jailbreakit-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: jailbreakit-darwin-arm64
          - goos: linux
            goarch: amd64
            name: jailbreakit-linux-amd64
          - goos: linux
            goarch: arm64
            name: jailbreakit-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/Waariss/jailbreakit/internal/version.Version=${GITHUB_REF_NAME} -X github.com/Waariss/jailbreakit/internal/version.Author=Mittcheng -X github.com/Waariss/jailbreakit/internal/version.Commit=${GITHUB_SHA} -X github.com/Waariss/jailbreakit/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${{ matrix.name }} ./cmd/jailbreakit
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
